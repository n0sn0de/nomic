[package]
name = "nomic-harness-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nomic-harness-fixture"
path = "src/main.rs"

[dependencies]
nomic-harness-protocol = { version = "=0.1.0", path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nomic-bridge-harness = { version = "=0.1.0", path = "../harness" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[test]]
name = "cli"
path = "tests/cli.rs"

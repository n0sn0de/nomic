[package]
name = "nomic-bridge-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nomic-bridge-harness"
path = "src/main.rs"

[dependencies]
nomic-harness-protocol = { version = "=0.1.0", path = "../protocol" }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8.23"
# Keep the derive stack compatible with the workspace's existing MIT/Apache-only policy.
unicode-ident = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nomic-harness-fixture = { version = "=0.1.0", path = "../fixture" }
nomic-harness-oracle = { version = "=0.1.0", path = "../oracle" }

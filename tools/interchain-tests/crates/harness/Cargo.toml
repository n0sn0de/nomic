[package]
name = "nomic-bridge-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nomic-bridge-harness"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.23"
# Keep the derive stack compatible with the workspace's existing MIT/Apache-only policy.
unicode-ident = "=1.0.1"
